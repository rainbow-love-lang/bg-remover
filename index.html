<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背景透過</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 40px;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #14161a; color: #e8eaed;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .btn {
    display: block; width: 100%; padding: 15px;
    border: none; border-radius: 12px;
    background: #3b6cf0; color: #fff;
    font-size: 16px; font-weight: 600; text-align: center;
    cursor: pointer;
  }
  .btn.sub { background: #2a2e35; color: #e8eaed; font-size: 14px; padding: 13px; }
  #file { display: none; }
  #status { font-size: 13px; color: #9aa0a6; min-height: 18px; white-space: pre-wrap; line-height: 1.6; }
  #status.error { color: #ff8a80; }

  #stage {
    position: relative; width: 100%;
    border-radius: 12px; overflow: hidden;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    display: none;
    touch-action: none;
    overscroll-behavior: contain;
  }
  #wrap { position: absolute; inset: 0; transform-origin: 0 0; }
  #view, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

  .tools { display: none; flex-direction: column; gap: 12px; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #2a2e35;
    background: #1c1f25; color: #9aa0a6; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .seg button.on { background: #3b6cf0; border-color: #3b6cf0; color: #fff; }
  .slider { display: flex; align-items: center; gap: 12px; }
  .slider label { font-size: 13px; color: #9aa0a6; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #3b6cf0; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .hidden { display: none !important; }
  #zoomInfo { font-size: 12px; color: #9aa0a6; text-align: right; }
</style>
</head>
<body>

<h1>背景透過</h1>

<label class="btn" for="file" id="pickLabel">写真を選ぶ</label>
<input id="file" type="file" accept="image/*">

<div id="status">準備中…</div>

<div id="stage">
  <div id="wrap">
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</div>

<div class="tools" id="tools">
  <div id="zoomInfo">拡大 1.0倍 ／ 2本指で拡大・移動</div>
  <div class="seg">
    <button id="modeErase" class="on">消す</button>
    <button id="modeRestore">戻す</button>
  </div>
  <div class="slider">
    <label>ブラシ</label>
    <input type="range" id="brush" min="6" max="160" value="40">
    <label id="brushVal">40</label>
  </div>
  <div class="row">
    <button class="btn sub" id="undo">1つ戻す</button>
    <button class="btn sub" id="fit">表示を戻す</button>
    <button class="btn sub" id="reset">やり直し</button>
  </div>
  <div class="row">
    <button class="btn sub" id="save">PNGで保存</button>
    <button class="btn sub hidden" id="share">共有</button>
  </div>
</div>

<script type="module">
// 編集時の最大サイズ（大きすぎるとスマホが重くなる）。上げたいときはこの数字を変える
const MAX_SIDE = 2048;
const MAX_UNDO = 8;
const MAX_ZOOM = 10;

const fileInput = document.getElementById('file');
const pickLabel = document.getElementById('pickLabel');
const statusEl  = document.getElementById('status');
const stageEl   = document.getElementById('stage');
const wrapEl    = document.getElementById('wrap');
const viewEl    = document.getElementById('view');
const overlayEl = document.getElementById('overlay');
const toolsEl   = document.getElementById('tools');
const zoomInfo  = document.getElementById('zoomInfo');
const eraseBtn  = document.getElementById('modeErase');
const restoreBtn= document.getElementById('modeRestore');
const brushEl   = document.getElementById('brush');
const brushVal  = document.getElementById('brushVal');
const undoBtn   = document.getElementById('undo');
const fitBtn    = document.getElementById('fit');
const resetBtn  = document.getElementById('reset');
const saveBtn   = document.getElementById('save');
const shareBtn  = document.getElementById('share');

const vctx = viewEl.getContext('2d');
const octx = overlayEl.getContext('2d');

let origCanvas = null;   // 元写真（標準形式に変換済み）
let cutCanvas  = null;   // 透過直後の状態
let tmpCanvas  = null;   // ブラシ合成用
let history    = [];
let removeBackground = null;
let busy = false;
let mode = 'erase';

// 表示変形
let scale = 1, tx = 0, ty = 0;

// 入力管理
const pointers = new Map();
let drawing = false;
let lastPt = null;
let pinch = null;
let suppressDraw = false;

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', !!isError);
}
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function canvasToBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => b ? resolve(b) : reject(new Error('画像の変換に失敗しました')), type, quality);
  });
}

// ライブラリ読み込み（export名の違いを両方吸収する）
try {
  const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  removeBackground = mod.removeBackground || mod.default;
  if (typeof removeBackground !== 'function') throw new Error('ライブラリの関数が見つかりません');
  setStatus('写真を選んでください');
} catch (e) {
  setStatus('ライブラリの読み込みに失敗しました。通信環境を確認して再読み込みしてください。\n' + e.message, true);
}

// 選んだ写真をブラウザで開いて、標準形式のキャンバスに正規化する
async function loadNormalized(file) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    const t = file.type || '不明';
    throw new Error(
      'この写真は開けませんでした（形式: ' + t + '）。\n' +
      'RAW（DNG）などブラウザが対応していない形式です。同じ写真のJPEG版を選ぶか、' +
      'カメラの設定でRAW保存をオフにしてください。'
    );
  }
  const s = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width  * s));
  const h = Math.max(1, Math.round(bmp.height * s));
  const c = newCanvas(w, h);
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close();
  return c;
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file || !removeBackground || busy) return;

  busy = true;
  pickLabel.style.opacity = '0.4';
  toolsEl.style.display = 'none';
  stageEl.style.display = 'none';
  history = [];
  setStatus('画像を読み込み中…');

  try {
    // 1. 正規化（ここでRAWなど非対応形式をはじく）
    const src = await loadNormalized(file);
    const w = src.width, h = src.height;

    // 2. 標準形式に変換したものを解析にかける
    setStatus('処理中… 初回はモデルのダウンロードで時間がかかります');
    const srcBlob = await canvasToBlob(src, 'image/png');

    const blob = await removeBackground(srcBlob, {
      output: { format: 'image/png' },
      progress: (key, current, total) => {
        const pct = total ? Math.round((current / total) * 100) : 0;
        const label = String(key).startsWith('fetch') ? 'ダウンロード中' : '解析中';
        setStatus(label + ' ' + pct + '%');
      }
    });

    // 3. 結果を元写真と同じ寸法で保持する
    const cutBmp = await createImageBitmap(blob);
    cutCanvas = newCanvas(w, h);
    cutCanvas.getContext('2d').drawImage(cutBmp, 0, 0, w, h);
    cutBmp.close();

    origCanvas = src;
    tmpCanvas  = newCanvas(w, h);

    viewEl.width = w; viewEl.height = h;
    overlayEl.width = w; overlayEl.height = h;
    vctx.clearRect(0, 0, w, h);
    vctx.drawImage(cutCanvas, 0, 0);

    stageEl.style.aspectRatio = w + ' / ' + h;
    resetTransform();

    stageEl.style.display = 'block';
    toolsEl.style.display = 'flex';
    setStatus('完了。2本指で拡大して、残った部分をなぞってください');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    busy = false;
    pickLabel.style.opacity = '1';
    fileInput.value = '';
  }
});

/* ---------- 表示（拡大・移動） ---------- */

function applyTransform() {
  const r = stageEl.getBoundingClientRect();
  if (scale <= 1) { scale = 1; tx = 0; ty = 0; }
  else {
    tx = Math.min(0, Math.max(r.width  * (1 - scale), tx));
    ty = Math.min(0, Math.max(r.height * (1 - scale), ty));
  }
  wrapEl.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  zoomInfo.textContent = '拡大 ' + scale.toFixed(1) + '倍 ／ 2本指で拡大・移動';
}
function resetTransform() {
  scale = 1; tx = 0; ty = 0;
  applyTransform();
}
fitBtn.addEventListener('click', resetTransform);

function stagePoint(clientX, clientY) {
  const r = stageEl.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}
function twoPointerInfo() {
  const [a, b] = [...pointers.values()];
  const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
  return {
    dist: Math.hypot(dx, dy) || 1,
    mid: stagePoint((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2)
  };
}
function startPinch() {
  const info = twoPointerInfo();
  pinch = { dist0: info.dist, mid0: info.mid, scale0: scale, tx0: tx, ty0: ty };
}
function updatePinch() {
  if (!pinch) return;
  const info = twoPointerInfo();
  const next = Math.min(MAX_ZOOM, Math.max(1, pinch.scale0 * (info.dist / pinch.dist0)));
  const px = (pinch.mid0.x - pinch.tx0) / pinch.scale0;
  const py = (pinch.mid0.y - pinch.ty0) / pinch.scale0;
  scale = next;
  tx = info.mid.x - px * next;
  ty = info.mid.y - py * next;
  applyTransform();
}

/* ---------- ブラシ ---------- */

function setMode(m) {
  mode = m;
  eraseBtn.classList.toggle('on', m === 'erase');
  restoreBtn.classList.toggle('on', m === 'restore');
}
eraseBtn.addEventListener('click', () => setMode('erase'));
restoreBtn.addEventListener('click', () => setMode('restore'));
brushEl.addEventListener('input', () => { brushVal.textContent = brushEl.value; });

function toCanvasPt(e) {
  const rect = viewEl.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (viewEl.width  / rect.width),
    y: (e.clientY - rect.top)  * (viewEl.height / rect.height)
  };
}
function brushSize() {
  const rect = viewEl.getBoundingClientRect();
  const ratio = rect.width ? (viewEl.width / rect.width) : 1;
  return Number(brushEl.value) * ratio;
}
function pushHistory() {
  const snap = newCanvas(viewEl.width, viewEl.height);
  snap.getContext('2d').drawImage(viewEl, 0, 0);
  history.push(snap);
  if (history.length > MAX_UNDO) history.shift();
}
function popHistory() {
  const snap = history.pop();
  if (!snap) return false;
  vctx.clearRect(0, 0, viewEl.width, viewEl.height);
  vctx.drawImage(snap, 0, 0);
  return true;
}
function strokePath(ctx, a, b, size) {
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}
function paintSegment(a, b) {
  const size = brushSize();
  if (mode === 'erase') {
    vctx.save();
    vctx.globalCompositeOperation = 'destination-out';
    vctx.strokeStyle = 'rgba(0,0,0,1)';
    strokePath(vctx, a, b, size);
    vctx.restore();
  } else {
    const tctx = tmpCanvas.getContext('2d');
    tctx.save();
    tctx.globalCompositeOperation = 'source-over';
    tctx.clearRect(0, 0, tmpCanvas.width, tmpCanvas.height);
    tctx.strokeStyle = '#fff';
    strokePath(tctx, a, b, size);
    tctx.globalCompositeOperation = 'source-in';
    tctx.drawImage(origCanvas, 0, 0);
    tctx.restore();
    vctx.save();
    vctx.globalCompositeOperation = 'source-over';
    vctx.drawImage(tmpCanvas, 0, 0);
    vctx.restore();
  }
}
function clearRing() {
  octx.clearRect(0, 0, overlayEl.width, overlayEl.height);
}
function drawRing(pt) {
  clearRing();
  if (!pt) return;
  octx.beginPath();
  octx.arc(pt.x, pt.y, brushSize() / 2, 0, Math.PI * 2);
  octx.strokeStyle = mode === 'erase' ? 'rgba(255,80,80,0.95)' : 'rgba(80,180,255,0.95)';
  octx.lineWidth = Math.max(1, brushSize() * 0.03);
  octx.stroke();
}
function startStroke(e) {
  drawing = true;
  pushHistory();
  lastPt = toCanvasPt(e);
  paintSegment(lastPt, lastPt);
  drawRing(lastPt);
}
function cancelStroke() {
  if (!drawing) return;
  drawing = false;
  lastPt = null;
  popHistory();
  clearRing();
}
function endStroke() {
  drawing = false;
  lastPt = null;
  clearRing();
}

stageEl.addEventListener('pointerdown', (e) => {
  if (!cutCanvas) return;
  e.preventDefault();
  stageEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);

  if (pointers.size === 1 && !suppressDraw) {
    startStroke(e);
  } else if (pointers.size === 2) {
    cancelStroke();
    suppressDraw = true;
    startPinch();
  }
});

stageEl.addEventListener('pointermove', (e) => {
  if (!cutCanvas) return;
  if (poi
