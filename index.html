<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背景透過</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #14161a; color: #e8eaed;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .btn {
    display: block; width: 100%; padding: 16px;
    border: none; border-radius: 12px;
    background: #3b6cf0; color: #fff;
    font-size: 16px; font-weight: 600; text-align: center;
    cursor: pointer;
  }
  .btn.sub { background: #2a2e35; color: #e8eaed; }
  .btn:disabled { opacity: .4; }
  #file { display: none; }
  #status { font-size: 14px; color: #9aa0a6; min-height: 20px; white-space: pre-wrap; }
  #status.error { color: #ff8a80; }
  #stage {
    border-radius: 12px; overflow: hidden; background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    display: none;
  }
  #stage img { display: block; width: 100%; height: auto; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>背景透過</h1>

<label class="btn" for="file" id="pickLabel">写真を選ぶ</label>
<input id="file" type="file" accept="image/*">

<div id="status">準備中…</div>

<div id="stage"><img id="result" alt="結果"></div>

<div class="row hidden" id="actions">
  <button class="btn sub" id="save">PNGで保存</button>
  <button class="btn sub hidden" id="share">共有</button>
</div>

<script type="module">
const fileInput = document.getElementById('file');
const pickLabel = document.getElementById('pickLabel');
const statusEl  = document.getElementById('status');
const stageEl   = document.getElementById('stage');
const resultEl  = document.getElementById('result');
const actionsEl = document.getElementById('actions');
const saveBtn   = document.getElementById('save');
const shareBtn  = document.getElementById('share');

let resultBlob = null;
let resultUrl  = null;
let removeBackground = null;
let busy = false;

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', !!isError);
}

// ライブラリ読み込み（export名の違いを両方吸収する）
try {
  const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  removeBackground = mod.removeBackground || mod.default;
  if (typeof removeBackground !== 'function') {
    throw new Error('ライブラリの関数が見つかりません');
  }
  setStatus('写真を選んでください');
} catch (e) {
  setStatus('ライブラリの読み込みに失敗しました。通信環境を確認して再読み込みしてください。\n' + e.message, true);
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file || !removeBackground || busy) return;

  busy = true;
  pickLabel.style.opacity = '0.4';
  actionsEl.classList.add('hidden');
  stageEl.style.display = 'none';
  if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
  resultBlob = null;
  setStatus('処理中… 初回はモデルのダウンロードで時間がかかります');

  try {
    const blob = await removeBackground(file, {
      output: { format: 'image/png' },
      progress: (key, current, total) => {
        const pct = total ? Math.round((current / total) * 100) : 0;
        const label = String(key).startsWith('fetch') ? 'ダウンロード中' : '解析中';
        setStatus(label + ' ' + pct + '%');
      }
    });

    resultBlob = blob;
    resultUrl = URL.createObjectURL(blob);
    resultEl.src = resultUrl;
    stageEl.style.display = 'block';
    actionsEl.classList.remove('hidden');
    setStatus('完了しました');
  } catch (e) {
    setStatus('処理に失敗しました: ' + e.message, true);
  } finally {
    busy = false;
    pickLabel.style.opacity = '1';
    fileInput.value = '';
  }
});

saveBtn.addEventListener('click', () => {
  if (!resultUrl) return;
  const a = document.createElement('a');
  a.href = resultUrl;
  a.download = 'transparent-' + Date.now() + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// 共有はスマホで対応している場合だけ表示
if (navigator.canShare) {
  const probe = new File([new Blob()], 'p.png', { type: 'image/png' });
  if (navigator.canShare({ files: [probe] })) {
    shareBtn.classList.remove('hidden');
    shareBtn.addEventListener('click', async () => {
      if (!resultBlob) return;
      try {
        const f = new File([resultBlob], 'transparent.png', { type: 'image/png' });
        await navigator.share({ files: [f] });
      } catch (e) { /* キャンセル時は何もしない */ }
    });
  }
}
</script>

</body>
</html>
